# One-command playground: `docker compose up -d` starts ClickHouse with both games installed.
#
#   ./wordle/play.sh                                                 # host clickhouse-client, localhost:9000
#   docker compose exec clickhouse clickhouse-client -d wordle       # or from inside the container
#   CLICKHOUSE_CLIENT="docker compose exec -T clickhouse clickhouse-client" ./wordle/play.sh
#
# The `default` user has no password, so the ports are published on 127.0.0.1 only.
# Move them if 8123/9000 are taken:  CLICKHOUSE_TCP_PORT=19000 docker compose up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-sql-games
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - .:/games:ro
      - ./docker/init-games.sh:/docker-entrypoint-initdb.d/init-games.sh:ro
      - ./docker/users.d/sql-games.xml:/etc/clickhouse-server/users.d/sql-games.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
